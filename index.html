<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deelautokaart van Dégage</title>

<!-- Het pictogram in het tabblad. Twee maten: 32 px voor het tabblad zelf, de
     512 voor wie de pagina aan zijn beginscherm hangt. Naamsvermelding staat in
     de voettekst van /gbfs/, in het instellingenpaneel van de kaart en in de
     README — dat is een voorwaarde van de licentie. -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!--
  Doorverwijzing naar de kaart.

  De kaart zelf staat in `map/index.html` en blijft daar: ze leest de feed via `../gbfs`
  en de foto's via `fotos/`, en die paden kloppen alleen vanuit `map/`. Dit bestandje
  bestaat enkel zodat de root van de site geen 404 geeft — GitHub Pages toont daar
  anders niets, want er is geen index.

  Drie lagen, want een doorverwijzing hoort niet van één ding af te hangen:
  · `meta refresh` werkt zonder JavaScript;
  · `location.replace` gaat sneller en laat geen lege stap in de geschiedenis achter,
    zodat de terugknop niet in een lus belandt;
  · de link eronder blijft over als allebei geblokkeerd zijn.

  Het pad is bewust RELATIEF. Zo werkt het zowel op een projectrepo
  (degagemain.github.io/degage-deelautokaart-gbfs/) als op een eigen domein of lokaal.
-->
<meta http-equiv="refresh" content="0; url=map/">
<link rel="canonical" href="map/">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1d2a28; background: #f4f6f5;
    text-align: center;
  }
  p { margin: 0; padding: 24px; }
  a { color: #235348; }
</style>
</head>
<body>
  <p>De kaart wordt geopend. Gebeurt er niets?
     <a href="map/">Ga naar de deelautokaart</a>.</p>
  <script>location.replace("map/");</script>
</body>
</html>
